<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bonus Portal</title>
<meta name="description" content="Bonus Portal">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1f4b8f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎁%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f5f9;--card:#fff;--ink:#14243b;--mute:#5d6b80;--line:#d9e0ea;
  --brand:#1f4b8f;--on:#fff;--ok:#16825d;--okbg:#e3f4ec;--err:#b3261e;
  --warn:#b45309;--warnbg:#fef3c7;--admin:#6d28d9;--adminbg:#f3e8ff;
  --off:#94a3b8;--offbg:#f1f5f9;
  color-scheme:light dark;
}
html.dark{
  --bg:#0e1623;--card:#172234;--ink:#e8eef7;--mute:#98a6bb;--line:#2a3850;
  --brand:#6fa3ee;--on:#0e1623;--ok:#58d3a2;--okbg:#12362b;--err:#ff8a80;
  --warn:#fbbf24;--warnbg:#422006;--admin:#c4b5fd;--adminbg:#2e1065;
  --off:#64748b;--offbg:#1e293b;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.5;min-height:100vh;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
header{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap;
  position:sticky;top:0;z-index:50;
}
header h1{font-size:17px;margin:0;font-weight:700}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);padding:5px 10px;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--brand);color:var(--on)}
main{max-width:780px;margin:0 auto;padding:18px 14px 56px}
h2{font-size:21px;margin:0 0 4px}
h3{font-size:16px;margin:0 0 10px}
p.sub{color:var(--mute);margin:0 0 16px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.details-box{
  margin-top:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);
  overflow:hidden;transition:border-color .15s;
}
.details-box[open]{border-color:var(--brand)}
.details-box > summary{
  list-style:none;cursor:pointer;padding:12px 14px;font-weight:600;font-size:14px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;user-select:none;
  color:var(--ink);
}
.details-box > summary::-webkit-details-marker{display:none}
.details-box > summary::after{
  content:"▾";font-size:12px;color:var(--mute);transition:transform .2s;
}
.details-box[open] > summary::after{transform:rotate(180deg)}
.details-box .details-body{
  padding:0 14px 14px;font-size:13.5px;line-height:1.55;color:var(--ink);
  white-space:pre-wrap;word-break:break-word;border-top:1px solid var(--line);
  margin-top:0;padding-top:12px;
}
.details-box .details-empty{color:var(--mute);font-style:italic}
label{display:block;font-weight:500;margin-bottom:4px;font-size:13px}
input,select,textarea{
  width:100%;font:inherit;font-size:15px;padding:9px 11px;
  border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);
}
textarea{min-height:64px;resize:vertical}
input:focus,button:focus-visible,select:focus,textarea:focus{outline:3px solid var(--brand);outline-offset:2px}
.btn{
  font:inherit;font-weight:500;background:var(--brand);color:var(--on);
  border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font-size:14px;
  display:inline-flex;align-items:center;gap:5px;
}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger{background:var(--err);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.block{width:100%;justify-content:center}
.btn:disabled{opacity:.5;cursor:not-allowed}
.stack>*+*{margin-top:11px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row > *{flex:1;min-width:110px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{
  font:inherit;text-align:left;background:var(--card);color:var(--ink);
  border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;
  font-weight:600;font-size:15px;transition:border-color .15s;position:relative;
}
.tile:hover{border-color:var(--brand)}
.tile.disabled{opacity:.55;border-style:dashed}
.logo{display:block;max-width:100%;height:52px;object-fit:contain;margin-bottom:7px}
.err{color:var(--err);min-height:1.2em;margin:0;font-size:13px}
.back{margin-bottom:12px}
.result{border-radius:12px;background:var(--okbg);padding:14px;margin-top:14px}
.result .amt{font-size:26px;font-weight:700;color:var(--ok);line-height:1.2}
.result .note{margin:7px 0 0;font-size:13px}
.result-breakdown{margin-top:11px;font-size:12px;border-top:1px solid rgba(0,0,0,.08);padding-top:9px}
.result-breakdown div{display:flex;justify-content:space-between;gap:8px;margin:2px 0}
.result-breakdown .total{font-weight:700;margin-top:5px;padding-top:5px;border-top:1px dashed rgba(0,0,0,.12)}
.muted{color:var(--mute);font-size:13px}
.badge{
  display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;
  border-radius:999px;background:var(--adminbg);color:var(--admin);
}
[hidden]{display:none!important}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.badge.warn{background:var(--warnbg);color:var(--warn)}.badge.err{background:var(--err);color:#fff}
.badge.off{background:var(--offbg);color:var(--off)}
.badge.ok{background:var(--okbg);color:var(--ok)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:var(--bg);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
.actions{display:flex;gap:5px;flex-wrap:wrap}
.divider{height:1px;background:var(--line);margin:16px 0}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:11px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--mute);margin-top:3px}
.field-group{display:grid;gap:9px}
.field-group.two{grid-template-columns:1fr 1fr}
@media(max-width:540px){.field-group.two{grid-template-columns:1fr}}
.tier-card{
  border:1px solid var(--line);border-radius:10px;padding:11px;background:var(--bg);margin-bottom:9px;
}
.tier-card header{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.pill{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--line);color:var(--mute)}
.toast{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;
  font-size:13px;z-index:100;opacity:0;pointer-events:none;transition:opacity .25s;
  max-width:90vw;text-align:center;
}
.toast.show{opacity:1}
.empty-state{text-align:center;padding:26px 14px;color:var(--mute)}
.admin-header{background:var(--adminbg)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:9px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
.stat .n{font-size:22px;font-weight:700;color:var(--brand)}
.stat .l{font-size:11px;color:var(--mute);margin-top:2px}
.cap-tag{font-size:10px;background:var(--warnbg);color:var(--warn);padding:1px 5px;border-radius:4px;margin-left:3px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--line);padding-bottom:8px}
.tabs button{
  border:0;background:transparent;color:var(--mute);padding:6px 12px;font:inherit;font-size:13px;
  cursor:pointer;border-radius:6px;font-weight:500;
}
.tabs button.on{background:var(--brand);color:var(--on)}
.log-item{padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}
.log-item:last-child{border-bottom:0}
.log-time{color:var(--mute);font-size:11px}
.toggle{
  position:relative;width:40px;height:22px;border-radius:11px;background:var(--off);
  cursor:pointer;border:0;transition:background .2s;flex-shrink:0;
}
.toggle.on{background:var(--ok)}
.toggle::after{
  content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;
  border-radius:50%;background:#fff;transition:transform .2s;
}
.toggle.on::after{transform:translateX(18px)}

body[data-design="dark"] .card{background:#0f172a;border-color:#1e293b}
body[data-design="soft"] .card{border-radius:18px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
body[data-design="bold"] .card{border-width:2px}
body[data-design="bold"] .btn{border-radius:4px;font-weight:700}
body[data-design="ocean"]{--brand:#0ea5e9;--ok:#06b6d4}
body[data-design="flower"]{--brand:#ec4899;--ok:#a855f7}
body[data-design="forest"]{--brand:#166534;--ok:#84cc16}
body[data-design="sunset"]{--brand:#f97316;--ok:#ef4444}
.theme-preview{height:48px;border-radius:8px;margin-top:6px;border:1px solid var(--line);background-size:cover;background-position:center}
.color-row{display:flex;gap:8px;align-items:center}
.color-row input[type=color]{width:48px;height:36px;padding:2px;border-radius:6px;cursor:pointer}

.login-wrap{max-width:400px;margin:40px auto;animation:loginIn .45s ease}
@keyframes loginIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.login-wrap .card{box-shadow:0 8px 28px rgba(0,0,0,.08);padding:22px}
.login-brand{text-align:center;margin-bottom:18px}
.login-brand .logo-circle{
  width:64px;height:64px;border-radius:16px;margin:0 auto 10px;
  background:linear-gradient(135deg,var(--brand),var(--ok));
  display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;
  box-shadow:0 6px 16px rgba(31,75,143,.35);
}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:44px}
.pw-toggle{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  border:0;background:transparent;color:var(--mute);cursor:pointer;
  font-size:13px;padding:4px 8px;font:inherit;
}
.pw-toggle:hover{color:var(--ink)}
.login-shake{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.btn.loading{opacity:.7;pointer-events:none}
.security-hint{font-size:11px;color:var(--mute);text-align:center;margin-top:8px}

body.role-user header{border-bottom-color:transparent}
body.role-admin header.admin-header{background:linear-gradient(90deg,var(--adminbg),var(--card))}
body.role-admin .tabs button.on{background:var(--admin);color:#fff}
.hero-login{
  min-height:calc(100vh - 60px);display:flex;align-items:center;justify-content:center;
  padding:24px 14px;position:relative;overflow:hidden;
}
.hero-login::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(15,23,42,.75),rgba(31,75,143,.55)),
    var(--login-photo, linear-gradient(135deg,#0f172a,#1e3a5f));
  background-size:cover;background-position:center;
  z-index:0;
}
.hero-login .login-wrap{position:relative;z-index:1;width:100%;max-width:400px;
  animation:loginIn .5s cubic-bezier(.22,1,.36,1)}
.hero-login .card{
  background:rgba(255,255,255,.92);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.4);box-shadow:0 20px 50px rgba(0,0,0,.25);
}
html.dark .hero-login .card{background:rgba(23,34,52,.9);border-color:rgba(255,255,255,.08)}
.hero-login .login-brand h2,.hero-login .login-brand .sub{color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.35)}
.hero-login .login-brand .sub{opacity:.9}
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:80;
  display:flex;align-items:center;justify-content:center;padding:16px;
  animation:loginIn .25s ease;
}
.modal-card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:20px;width:100%;max-width:360px;box-shadow:0 16px 40px rgba(0,0,0,.2)}
.user-home-hero{
  border-radius:14px;overflow:hidden;margin-bottom:16px;min-height:120px;
  background:linear-gradient(135deg,var(--brand),var(--ok));
  display:flex;align-items:flex-end;padding:16px;color:#fff;
  background-size:cover;background-position:center;
}
.user-home-hero h2{margin:0;font-size:20px;text-shadow:0 2px 6px rgba(0,0,0,.3)}

.water-mode .hero-login::after{
  content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(255,255,255,.08),transparent 40%,rgba(0,40,80,.25)),
    repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(255,255,255,.03) 3px,rgba(255,255,255,.03) 4px);
  animation:waterShift 8s ease-in-out infinite alternate;
  mix-blend-mode:overlay;
}
@keyframes waterShift{
  from{transform:translateY(0);opacity:.7}
  to{transform:translateY(8px);opacity:1}
}
.water-mode .hero-login .card{
  background:rgba(255,255,255,.18)!important;
  backdrop-filter:blur(16px) saturate(1.4);
  border:1px solid rgba(255,255,255,.35)!important;
  box-shadow:0 20px 50px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.4);
  color:#fff;
}
.water-mode .hero-login .card label,
.water-mode .hero-login .card .security-hint,
.water-mode .hero-login .card .muted{color:rgba(255,255,255,.85)}
.water-mode .hero-login .card input,
.water-mode .hero-login .card select{
  background:rgba(255,255,255,.15)!important;
  border-color:rgba(255,255,255,.3)!important;
  color:#fff!important;
}
.water-mode .hero-login .card input::placeholder{color:rgba(255,255,255,.5)}
.water-mode .hero-login .card .err{color:#fecaca}
.water-mode .hero-login .pw-toggle{color:rgba(255,255,255,.8)}
.water-mode .user-home-hero{
  position:relative;overflow:hidden;
}
.water-mode .user-home-hero::after{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 4px,rgba(255,255,255,.04) 4px,rgba(255,255,255,.04) 5px);
  animation:waterShift 6s ease-in-out infinite alternate;
  pointer-events:none;
}

body.role-guest{
  background:#0a1628;
}
body.role-guest header{
  background:transparent!important;
  border:none!important;
  position:absolute;width:100%;
}
body.role-guest header h1,
body.role-guest .seg button{color:#fff!important;text-shadow:0 1px 3px rgba(0,0,0,.5)}
body.role-guest main{max-width:none;padding:0;min-height:100vh}
.hero-login{
  min-height:100vh!important;width:100%;
  display:flex;align-items:center;justify-content:center;
  padding:24px 14px;position:relative;overflow:hidden;
}
.hero-login::before{
  content:"";position:absolute;inset:0;z-index:0;
  background-image: var(--login-photo, linear-gradient(135deg,#0f172a,#1e3a5f));
  background-size:cover!important;
  background-position:center!important;
  background-repeat:no-repeat!important;
  filter:none;
}
.hero-login::after{
  content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(8,20,40,.35) 0%,rgba(8,20,40,.15) 40%,rgba(8,20,40,.45) 100%),
    repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(255,255,255,.025) 3px,rgba(255,255,255,.025) 4px);
  animation:waterShift 10s ease-in-out infinite alternate;
}
.hero-login .login-wrap{position:relative;z-index:2}
/* full page bg after login for user */
body.role-user{
  background:#0a1628;
  background-image: var(--app-photo, none);
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
}
body.role-user::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(8,20,40,.5),rgba(8,20,40,.65));
}
body.role-user header,
body.role-user main{position:relative;z-index:1}
body.role-user header{
  background:rgba(15,23,42,.45)!important;
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.1)!important;
}
body.role-user header h1{color:#fff}
body.role-user .card{
  background:rgba(255,255,255,.12)!important;
  backdrop-filter:blur(14px) saturate(1.3);
  border:1px solid rgba(255,255,255,.2)!important;
  color:#fff;
}
body.role-user .card label,
body.role-user .muted,
body.role-user .sub,
body.role-user h2,body.role-user h3{color:#fff!important}
body.role-user input,body.role-user select,body.role-user textarea{
  background:rgba(255,255,255,.12)!important;
  border-color:rgba(255,255,255,.25)!important;
  color:#fff!important;
}
body.role-user .tile{
  background:rgba(255,255,255,.12)!important;
  border-color:rgba(255,255,255,.2)!important;
  color:#fff!important;
  backdrop-filter:blur(10px);
}
body.role-user .user-home-hero{
  background:transparent!important;
  min-height:auto;
  padding:8px 0 16px;
}

.clock-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;margin:0 0 12px}
.clock-chip{
  background:var(--clock-bg,rgba(255,255,255,.14));
  border:1px solid var(--clock-border, rgba(255,255,255,.2));
  border-radius:999px;padding:5px 12px;backdrop-filter:blur(8px);
  color:var(--clock-text, #fff);white-space:nowrap;
}
.clock-select{
  background:var(--select-bg, var(--bg))!important;
  color:var(--select-text, var(--ink))!important;
  border-color:var(--clock-border, var(--line))!important;
}
.btn[data-act="copyNote"], .btn.ghost.back, button.btn.ghost.sm.back{
  background:var(--copy-bg, transparent)!important;
  color:var(--copy-text, var(--ink))!important;
  border-color:var(--copy-bg, var(--line))!important;
}

body.role-admin .clock-chip,body:not(.role-user):not(.role-guest) .clock-chip{
  background:var(--card);border-color:var(--line);color:var(--ink);
}
.clock-chip b{font-weight:600;margin-right:6px;opacity:.85}
.clock-select{font:inherit;font-size:12px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}


.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:14px 0}
.stat-card{
  border-radius:12px;padding:14px;border:1px solid var(--line);background:var(--card);
  animation:statIn .45s ease backwards;
}
.stat-card:nth-child(1){animation-delay:.05s}
.stat-card:nth-child(2){animation-delay:.1s}
.stat-card:nth-child(3){animation-delay:.15s}
.stat-card:nth-child(4){animation-delay:.2s}
.stat-card:nth-child(5){animation-delay:.25s}
@keyframes statIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.stat-card .ico{font-size:20px;margin-bottom:4px}
.stat-card .val{font-size:24px;font-weight:700}
.stat-card .lbl{font-size:12px;color:var(--mute);margin-top:2px}
.stat-card .bar{height:4px;border-radius:99px;background:rgba(127,127,127,.15);margin-top:8px;overflow:hidden}
.stat-card .bar>i{display:block;height:100%;border-radius:99px;width:0;animation:barFill .9s ease forwards;background:var(--brand)}
@keyframes barFill{to{width:var(--w,60%)}}
.chart-bars{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:6px}
.chart-bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.chart-bars .col .fill{
  width:100%;max-width:32px;border-radius:6px 6px 3px 3px;
  background:linear-gradient(180deg,var(--brand),var(--ok));
  animation:growUp .7s ease backwards;transform-origin:bottom;
}
@keyframes growUp{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.chart-bars .col span{font-size:10px;color:var(--mute);text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis}

/* ===== Unified professional portal design ===== */
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --ink:#17243a;
  --mute:#64748b;
  --line:#e2e8f0;
  --brand:#2457a6;
  --on:#ffffff;
  --ok:#13845e;
  --okbg:#e8f7f0;
  --err:#c43d45;
  --warn:#a96512;
  --warnbg:#fff5df;
  --admin:#6741b8;
  --adminbg:#f1edfb;
  --off:#8a98aa;
  --offbg:#f1f4f8;
}
html.dark{
  --bg:#101827;
  --card:#182437;
  --ink:#e8eef7;
  --mute:#9aa9bd;
  --line:#2a3a51;
  --brand:#6b9be8;
  --on:#101827;
  --ok:#52c99a;
  --okbg:#12382d;
  --err:#ff858b;
  --warn:#f4bd61;
  --warnbg:#3a2c16;
  --admin:#c4b1f5;
  --adminbg:#30264b;
  --off:#718096;
  --offbg:#202d40;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-size:15px}
header{
  min-height:64px;padding:10px clamp(14px,3vw,32px);
  background:var(--card)!important;border-bottom:1px solid var(--line)!important;
  box-shadow:0 2px 12px rgba(15,23,42,.045);
  backdrop-filter:blur(14px);
}
header h1{font-size:19px;letter-spacing:-.2px}
.tools{gap:8px}
main#app{width:min(1180px,100%);max-width:1180px;margin:0 auto;padding:26px clamp(14px,3vw,30px) 64px}
.card,.stat-card{
  background:var(--card)!important;border:1px solid var(--line)!important;
  border-radius:16px!important;box-shadow:0 4px 18px rgba(15,23,42,.045);
  padding:18px;
}
h2{font-size:clamp(20px,2.3vw,26px);letter-spacing:-.35px;line-height:1.25}
h3{font-size:17px;letter-spacing:-.15px}
p.sub{font-size:14px;color:var(--mute);line-height:1.65}
.btn{
  min-height:38px;border-radius:10px;padding:8px 14px;
  font-weight:600;letter-spacing:.05px;transition:transform .15s ease,box-shadow .15s ease,filter .15s ease;
}
.btn:hover{filter:brightness(1.04);box-shadow:0 4px 12px rgba(36,87,166,.16);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn.danger:hover{box-shadow:0 4px 12px rgba(196,61,69,.18)}
input,select,textarea{
  min-height:42px;border-radius:10px;background:var(--card);
  border-color:var(--line);padding:9px 12px;transition:border-color .15s,box-shadow .15s;
}
textarea{min-height:84px}
input:focus,select:focus,textarea:focus{
  outline:0;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 16%,transparent);
}
label{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px}
.tile{
  border-radius:14px;padding:16px;min-height:76px;
  box-shadow:0 2px 8px rgba(15,23,42,.035);
  transition:transform .16s,border-color .16s,box-shadow .16s;
}
.tile:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,23,42,.08)}
.grid,.grid2{gap:14px}
.stat-grid{gap:14px;margin:18px 0}
.stat-card{padding:16px}
.stat-card .val{font-size:clamp(22px,2.4vw,28px);letter-spacing:-.5px}
.table-wrap{border-radius:13px;background:var(--card)}
table{font-size:13px}
th,td{padding:11px 13px}
th{background:var(--bg);color:var(--mute);font-size:12px;text-transform:none}
tr:hover td{background:color-mix(in srgb,var(--brand) 4%,var(--card))}
.badge{font-size:11px;padding:4px 9px;font-weight:700}
.section-title{margin-bottom:14px}
.divider{margin:20px 0;background:var(--line)}
.stack>*+*{margin-top:14px}
.result{border:1px solid color-mix(in srgb,var(--ok) 20%,transparent);border-radius:14px}
.toast{border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.18);z-index:1000}
.seg{border-radius:10px;background:var(--bg);border-color:var(--line)}
.seg button{padding:6px 11px}
.seg button.on{border-radius:8px}
.logo{height:48px;object-position:left center}
/* Keep authenticated user/admin pages visually consistent; retain the guest login artwork. */
body.role-user{
  background:var(--bg)!important;background-image:none!important;
  color:var(--ink);
}
body.role-user::before{display:none!important}
body.role-user header{
  background:var(--card)!important;border-bottom:1px solid var(--line)!important;
}
body.role-user header h1{color:var(--ink)!important;text-shadow:none}
body.role-user .card,body.role-user .stat-card{
  background:var(--card)!important;border:1px solid var(--line)!important;
  color:var(--ink)!important;backdrop-filter:none;box-shadow:0 4px 18px rgba(15,23,42,.045);
}
body.role-user .card label,body.role-user .muted,body.role-user .sub,
body.role-user h2,body.role-user h3{color:var(--ink)!important}
body.role-user .muted,body.role-user .sub{color:var(--mute)!important}
body.role-user input,body.role-user select,body.role-user textarea{
  background:var(--card)!important;border-color:var(--line)!important;color:var(--ink)!important;
}
body.role-user .tile{
  background:var(--card)!important;border-color:var(--line)!important;
  color:var(--ink)!important;backdrop-filter:none;
}
body.role-user .user-home-hero{background:transparent!important}
body.role-user .clock-chip{background:var(--card);border-color:var(--line);color:var(--ink)}
body.role-admin{background:var(--bg)}
body.role-admin main#app{max-width:1180px}
@media(min-width:900px){
  body.role-admin main#app{padding-top:30px}
}
@media(max-width:700px){
  header{align-items:flex-start;padding:10px 12px}
  header h1{font-size:17px}
  .tools{width:100%;justify-content:flex-end}
  main#app{padding:18px 12px 44px}
  .card{padding:14px}
  .stat-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .stat-card{padding:12px}
  .stat-card .val{font-size:22px}
  .table-wrap{max-width:100%}
}
@media(max-width:380px){
  .stat-grid{grid-template-columns:1fr 1fr}
  .btn{padding:7px 10px;font-size:13px}
  .tools{gap:5px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}


/* ===== Login page v2 ===== */
body.role-guest{background:#08142a}
body.role-guest #ttl{visibility:hidden}

body.role-guest .seg{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.4)}

.lp-card h3{margin:0 0 2px;font-size:22px}.lp-card .sub{margin:0 0 18px;font-size:14px;color:var(--mute)}
.lp-card .fld{margin-bottom:14px}
.lp-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin:2px 0 14px;color:var(--mute)}
.lp-row label{display:flex;align-items:center;gap:6px;margin:0;font-weight:400;cursor:pointer}.lp-row input{width:auto;margin:0}
.lp-card .lp-err{color:var(--err);font-size:13px;margin:0 0 12px}.lp-err:empty{display:none}
.lp-caps{font-size:12px;color:var(--warn);background:var(--warnbg);padding:6px 10px;border-radius:8px;margin-bottom:12px}
.lp-notice{font-size:12px;color:var(--mute);background:var(--offbg);border-radius:10px;padding:10px 12px;margin-top:16px;display:grid;gap:4px}
.lp-foot{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:16px}
.lp-net.ok{color:var(--ok)}.lp-net.off{color:var(--err)}
@media(max-width:900px){.lp{grid-template-columns:1fr}.lp-brand{padding:84px 22px 0;gap:14px}.lp-feats,.lp-clock{display:none}.lp-form{padding:18px 14px 40px}}
.lp-link{border:0;background:none;color:var(--brand);font:inherit;font-size:13px;cursor:pointer;padding:0;text-decoration:underline}
@media(prefers-reduced-motion:reduce){.lp-card{animation:none}}
footer#siteFoot{text-align:center;font-size:12px;color:var(--mute);padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px))}body.role-guest footer#siteFoot{display:none}

/* ---- design polish ---- */
:root{--r:14px;--shadow:0 1px 2px rgba(20,36,59,.06),0 8px 24px rgba(20,36,59,.07)}
html.dark{--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
header{box-shadow:var(--shadow)}
.tools{justify-content:flex-end}
.card{border-radius:var(--r);box-shadow:var(--shadow)}
.tile{border-radius:var(--r);box-shadow:var(--shadow);min-height:84px;background:linear-gradient(160deg,var(--card) 55%,color-mix(in srgb,var(--brand) 12%,var(--card)));transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-2px)}.tile:active{transform:scale(.98)}
.btn{border-radius:10px;transition:filter .15s,transform .1s}.btn:active{transform:scale(.97)}
input,select,textarea{border-radius:10px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent)}
.result{border-radius:var(--r);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent)}
.bot-chat{background:var(--bg);border-radius:12px;scroll-behavior:smooth}
.bot-msg{box-shadow:0 1px 2px rgba(0,0,0,.06);word-break:break-word}
.table-wrap{box-shadow:var(--shadow)}
@media(max-width:540px){header{padding:8px 10px}.seg button{padding:4px 8px}main{padding:14px 12px 72px}.tools .btn{padding:6px 9px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ---- spin ---- */
.spin-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.spin-wheel{width:min(86vw,320px);aspect-ratio:1;border-radius:50%;box-shadow:var(--shadow),0 0 0 6px var(--card),0 0 0 8px var(--line)}
.spin-svg{width:100%;height:100%;display:block;transition:transform 4.2s cubic-bezier(.12,.6,.1,1)}
.spin-ptr{font-size:32px;line-height:1;color:var(--err);margin-bottom:-18px;z-index:2;position:relative;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}

.typing{display:flex;gap:5px;align-items:center;padding:13px 14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:bpdot 1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bpdot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.bot-msg img{max-height:180px;object-fit:contain;margin-right:6px}

<header id="hdr">
  <h1 id="ttl"></h1>
  <div class="tools">
    <div class="seg" role="group" aria-label="Language">
      <button data-lang="bn">বাংলা</button>
      <button data-lang="en">English</button>
    </div>
    <span class="badge err" id="shotInd" hidden>🔴 Screen</span><button class="btn ghost sm" id="btnSearch" data-act="sm_search" title="Ctrl+K" hidden>🔍</button><button class="btn ghost sm" id="btnTl" data-act="sm_tl" hidden>🕑</button><button class="btn ghost sm" id="btnBell" data-act="sm_bell" hidden>🔔</button>
    <button class="btn ghost sm" id="btnTheme" title="Theme">🌓</button>

  </div>
</header>
<main id="app"></main>
<footer id="siteFoot"></footer>
<div class="toast" id="toast"></div>
<script>

const BN_NUM = ["১","২","৩","৪","৫","৬","৭","৮","৯","১০","১১","১২","১৩","১৪","১৫"];
function defaultTier(o={}){return Object.assign({min:0,type:"percent",value:100,maxBonus:0,turnover:0,note:{bn:"",en:""}},o)}

function defaultPercentOptions(){
  return [
    {id:uid(), active:true, percent:100, maxBonus:500, turnover:10, minDeposit:100, color:"#1f4b8f",
      name:{bn:"১ম ডিপোজিট বোনাস", en:"1st Deposit Bonus"}, note:{bn:"",en:""}},
    {id:uid(), active:true, percent:50, maxBonus:300, turnover:8, minDeposit:100, color:"#16825d",
      name:{bn:"২য় ডিপোজিট বোনাস", en:"2nd Deposit Bonus"}, note:{bn:"",en:""}},
    {id:uid(), active:true, percent:25, maxBonus:200, turnover:5, minDeposit:100, color:"#b45309",
      name:{bn:"৩য় ডিপোজিট বোনাস", en:"3rd Deposit Bonus"}, note:{bn:"",en:""}}
  ];
}
function ensureBonusShape(bo){
  if(!bo) return bo;
  if(!bo.bonusMode) bo.bonusMode = "percent"; // percent | fixed
  if(!bo.color) bo.color = "#1f4b8f";
  if(!Array.isArray(bo.percentOptions)) bo.percentOptions = [];
  if(!Array.isArray(bo.tiers)) bo.tiers = [defaultTier({value:100,maxBonus:500,turnover:10})];
  if(!bo.details || typeof bo.details !== "object") bo.details = {bn:"",en:""};
  if(bo.details.bn == null) bo.details.bn = "";
  if(bo.details.en == null) bo.details.en = "";
  return bo;
}

const slots=(n,o={})=>Array.from({length:n},(_,i)=>{
  const c=o[i+1]||{};
  return Object.assign({id:"s"+(i+1),image:"",active:true,name:{bn:"বোনাস "+BN_NUM[i],en:"Bonus "+(i+1)},tiers:[defaultTier({value:5,note:{bn:"নমুনা নোট।",en:"Sample note."}})]},c);
});
const DEFAULT_DATA={
  version:3,
  users:{user:{username:"s10bonus",password:"1234"},admin:{username:"s10bonus",password:"admin123"}},
  currency:{bn:"টাকা",en:"BDT"},

function phWeekRange(){
  // Philippines time Mon 00:00:00 → Sun 23:59:59
  const fmt = new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Manila",year:"numeric",month:"2-digit",day:"2-digit",weekday:"short"});
  const parts = fmt.formatToParts(new Date());
  const get = t => parts.find(p=>p.type===t)?.value;
  // get PH date as YYYY-MM-DD
  const ymd = new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Manila",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
  const wd = new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Manila",weekday:"short"}).format(new Date());
  // Map weekday to offset from Monday
  const map={Mon:0,Tue:1,Wed:2,Thu:3,Fri:4,Sat:5,Sun:6};
  const off = map[wd] ?? 0;
  const [Y,M,D] = ymd.split("-").map(Number);
  const utcApprox = Date.UTC(Y, M-1, D);
  const mon = new Date(utcApprox - off*86400000);
  const sun = new Date(mon.getTime() + 6*86400000);
  const f = d => d.toISOString().slice(0,10);
  return {
    start: f(mon) + " 00:00:00",
    end: f(sun) + " 23:59:59",
    startDate: f(mon),
    endDate: f(sun)
  };
}

function calculateBn88Bonus(dep, tier){
  const type = tier.type || "percent";
  let bonus = type==="percent" ? dep * ((+tier.value||0)/100) : (+tier.maxBonus||+tier.value||0);
  const maxB = +tier.maxBonus || 0;
  let finalBonus = maxB > 0 ? Math.min(bonus, maxB) : bonus;
  const eligible = dep; // full deposit counts in BN88 base
  const excess = 0;
  const to = +tier.turnover || 0;
  const bonusTO = (eligible + finalBonus) * to;
  const extraTO = dep * 1; // BN88 rule: + deposit at 1x
  const totalTO = bonusTO + extraTO;
  return {
    type, finalBonus, capped: maxB>0 && bonus>maxB,
    eligibleDeposit: eligible, excessDeposit: excess,
    bonusTurnover: bonusTO, excessTurnover: extraTO, totalTurnover: totalTO,
    accountTotal: dep + finalBonus, hasTurnover: to > 0
  };
}
function needDepositForMax(percentOrValue, maxBonus, type){
  const max = +maxBonus || 0;
  if(max <= 0) return 0;
  if(type === "fixed") return max; // 1:1 for fixed
  const pct = +percentOrValue || 0;
  if(pct <= 0) return 0;
  return max * 100 / pct;
}
function calculateBonus(deposit,tier){
  const n = +deposit;
  const type = tier.type === "fixed" ? "fixed" : "percent";
  const value = +tier.value || 0;
  const maxBonus = +tier.maxBonus || 0;
  const turnover = +tier.turnover || 0;

  let rawBonus = 0, finalBonus = 0, capped = false, eligibleDeposit = n;

  if(type === "fixed"){
    // Fixed → received bonus is Max Bonus (or Value if Max is 0)
    finalBonus = maxBonus > 0 ? maxBonus : value;
    rawBonus = finalBonus;
    // Same rule: only the portion needed for this bonus gets full TO
    // Treat as 1:1 → need deposit = finalBonus amount
    eligibleDeposit = Math.min(n, finalBonus);
  } else {
    // Percent
    rawBonus = n * value / 100;
    finalBonus = rawBonus;
    if(maxBonus > 0 && rawBonus > maxBonus){
      finalBonus = maxBonus;
      capped = true;
    }
    if(value > 0 && maxBonus > 0){
      const needForMax = maxBonus * 100 / value;
      eligibleDeposit = Math.min(n, needForMax);
    } else if(value > 0 && maxBonus <= 0){
      eligibleDeposit = n;
    }
  }

  eligibleDeposit = Math.min(Math.max(0, eligibleDeposit), n);
  const excessDeposit = Math.max(0, n - eligibleDeposit);

  let bonusTurnover = 0, excessTurnover = 0, totalTurnover = 0;
  if(turnover > 0){
    // (eligible deposit + bonus) × multiplier
    bonusTurnover = (eligibleDeposit + finalBonus) * turnover;
    // extra deposit at 1×
    excessTurnover = excessDeposit * 1;
    totalTurnover = bonusTurnover + excessTurnover;
  }

  return {
    finalBonus, rawBonus, capped, type,
    eligibleDeposit, excessDeposit,
    bonusTurnover, excessTurnover, totalTurnover,
    hasTurnover: turnover > 0,
    accountTotal: n + finalBonus
  };
}

function botShrink(src,cb){const im=new Image();im.onload=()=>{const r=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*r;c.height=im.height*r;c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.85))};im.onerror=()=>cb(src);im.src=src}
function botAttachFile(f){

}

function botType(L,text,done){
  const m={role:"bot",text:"",ts:Date.now(),done:false};L.push(m);
  const step=Math.max(2,Math.ceil(text.length/80));let i=0;
  const iv=setInterval(()=>{i+=step;m.text=text.slice(0,i);if(i>=text.length){clearInterval(iv);m.text=text;m.done=true;done&&done()}botPaint()},20);
}
async function botAsk(text,imgs){
  imgs=imgs||[];
  const bn=lang==="bn",L=window._botLog||(window._botLog=[]),H=window._botHist||(window._botHist=[]),now=Date.now();
  L.push({role:"user",text:text||(bn?"[ছবি]":"[Photo]"),imgs,ts:now});
  H.push({role:"user",text:text||"",imgs,ts:now});
  window._botBusy=true;window._botAttach=[];window._botDraft="";botSave();renderSportsBot();
  let reply="",ok=false;
  try{
    const ctl=new AbortController();setTimeout(()=>ctl.abort(),60000);
    let left=4;const msgs=H.slice(-14).map(m=>({role:m.role,text:m.text,imgs:[]}));
    for(let k=H.length-1,j=msgs.length-1;j>=0;j--,k--){const im=(H[k].imgs||[]).slice(0,left);msgs[j].imgs=im;left-=im.length}
    while(msgs[0]&&msgs[0].role!=="user")msgs.shift();
    const r=await fetch(APP_DATA.sportsBot?.aiUrl||"/.netlify/functions/bot",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({lang,messages:msgs}),signal:ctl.signal});
    if(!r.ok)throw 0;reply=(await r.json()).reply;if(!reply)throw 0;ok=true;window._botOffline=false;
  }catch(e){window._botOffline=true}
  window._botBusy=false;
  if(ok){
    H.push({role:"assistant",text:reply,ts:Date.now()});
    if(!APP_DATA.sportsBot)APP_DATA.sportsBot={tickets:[]};
    (APP_DATA.sportsBot.tickets=APP_DATA.sportsBot.tickets||[]).unshift({id:uid(),t:Date.now(),user:currentUser||"user",issue:"ai",text:text||"",hasImg:imgs.length>0,img:null,note:reply,status:"open"});
    APP_DATA.sportsBot.tickets=APP_DATA.sportsBot.tickets.slice(0,50);saveData(true);
    botType(L,reply,botSave);
  }else{
    botReply(text,imgs[0]||null).forEach(x=>L.push({role:"bot",text:x,ts:Date.now()}));
    botSave();if(view==="sports-bot")renderSportsBot();
  }
}

function updateNeedDep(){
  const type = $("#fcType")?.value;
  const val = +$("#fcVal")?.value || 0;
  const max = +$("#fcMax")?.value || 0;
  let need = "—";
  if(type === "percent" && val > 0 && max > 0){
    need = num(max * 100 / val) + " " + APP_DATA.currency[lang];
  } else if(type === "fixed"){
    const fb = max > 0 ? max : (+$("#fcVal")?.value || 0);
    if(fb > 0) need = num(fb) + " " + APP_DATA.currency[lang];
  }
  if($("#fcNeed")) $("#fcNeed").value = need;
}

function runFrontCalc(){
  const out = $("#fcOut");
  if(!out) return;
  const dep = +$("#fcDep")?.value || 0;
  const eligStart = +$("#fcElig")?.value || 0;
  const cur = APP_DATA.currency[lang];

  if(dep < 100){
    out.innerHTML = `<p class="err">${t("minDepHint")}</p>`;
    buildAutoNote(null);
    return;
  }
  if(dep < eligStart){
    out.innerHTML = `<p class="muted">${t("none")}</p>`;
    buildAutoNote(null);
    return;
  }
  const tier = {
    type: $("#fcType").value,
    value: +$("#fcVal").value || 0,
    maxBonus: +$("#fcMax").value || 0,
    turnover: +$("#fcTO").value || 0,
    min: eligStart
  };
  const r = calculateBonus(dep, tier);

  let html = `<div class="result">
    <div>${t("bonusIs")}${r.capped ? ` <span class="cap-tag">${t("capped")}</span>` : ""}${r.type==="fixed" ? ` <span class="cap-tag">Fixed</span>` : ""}</div>
    <div class="amt">${num(r.finalBonus)} ${cur}</div>
    <div class="result-breakdown">
      <div><span>${lang==="bn"?"অ্যাকাউন্টে টোটাল":"Account total"}</span><span>${num(r.accountTotal)} ${cur}</span></div>
      <div><span>${t("eligibleDep")}</span><span>${num(r.eligibleDeposit)} ${cur}</span></div>`;
  if(r.excessDeposit > 0){
    html += `<div><span>${t("excessDep")}</span><span>${num(r.excessDeposit)} ${cur}</span></div>`;
  }
  if(r.hasTurnover){
    html += `<div><span>${t("bonusTO")}</span><span>${num(r.bonusTurnover)} ${cur}</span></div>`;
    if(r.excessDeposit > 0){
      html += `<div><span>${t("excessTO")}</span><span>${num(r.excessTurnover)} ${cur}</span></div>`;
    }
    html += `<div class="total"><span>${t("totalTO")}</span><span>${num(r.totalTurnover)} ${cur}</span></div>`;
  }
  html += `</div></div>`;
  out.innerHTML = html;
  buildAutoNote({dep, r, cur});
}

function buildAutoNote(data){
  const ta = $("#fcNote");
  if(!ta) return;
  if(!data){ ta.value = ""; return; }
  const {dep, r, cur} = data;
  const map = {
    deposit: num(dep),
    bonus: num(r.finalBonus),
    total: num(r.accountTotal),
    turnover: num(r.hasTurnover ? r.totalTurnover : 0),
    cur: cur
  };
  const key = lang==="bn" ? "calcBn" : "calcEn";
  ta.value = fillTemplate(getNoteTpl(key), map);
}

function renderBonusCalc(){

  const backAct = (!isFixed && percentOpt) ? "toPercentSlots" : "toBrand";
  const title = isFixed ? bonus.name[lang] : (percentOpt ? percentOpt.name[lang] : bonus.name[lang]);

  if(isFixed){
    const t0=(bonus.tiers&&bonus.tiers[0])||{};
    const need=needDepositForMax(0, t0.maxBonus||t0.value||0, "fixed");
    if(need>0) needInfo=`<p class="muted">${t("needForMax")||"Deposit needed for max"}: <strong>${num(need)}</strong> ${APP_DATA.currency[lang]}</p>`;

    if(need>0) needInfo=`<p class="muted">${t("needForMax")||"Deposit needed for max"}: <strong>${num(need)}</strong> ${APP_DATA.currency[lang]} <span class="hint">(${percentOpt.percent}% → max ${num(percentOpt.maxBonus||0)})</span></p>`;
  }
  const detText = (bonus.details?.[lang] || bonus.details?.bn || bonus.details?.en || "").trim();
  const detailsHtml = `<details class="details-box">
      <summary>📋 ${t("showDetails")}</summary>
      <div class="details-body ${detText?"":"details-empty"}">${detText?esc(detText):t("noDetails")}</div>
    </details>`;
  app.innerHTML=`<button class="btn ghost sm back" data-act="${backAct}">${t("back")}</button>
    <h2>${esc(title)}</h2><p class="sub">${sub}</p>
    <div class="card"><label for="amt">${t("enter")}</label>
    <input id="amt" type="number" inputmode="decimal" min="0" step="any" autofocus>
    ${needInfo}
    <div id="out" aria-live="polite"></div></div>
    ${detailsHtml}`;
  $("#amt").addEventListener("input",calc);calc();
}
function calc(){
  const out=$("#out"),v=$("#amt").value;
  if(!out)return;
  if(v===""||isNaN(+v)||+v<0){out.innerHTML=`<p class="muted">${t("empty")}</p>`;return}
  const n=+v;
  ensureBonusShape(bonus);
  let tier, slotName="", slotPct=0, minDep=100, isFixed=bonus.bonusMode==="fixed";
  if(isFixed){
    const t0=(bonus.tiers&&bonus.tiers[0])||defaultTier({type:"fixed",value:500,maxBonus:500,turnover:10,min:100});
    minDep=+t0.min||100;
    tier={type:"fixed", value:t0.value||0, maxBonus:t0.maxBonus||0, turnover:t0.turnover||0, min:minDep, note:t0.note||{bn:"",en:""}};
  } else if(percentOpt){
    minDep=+percentOpt.minDeposit||100;
    slotName=percentOpt.name?.[lang]||percentOpt.name?.en||"";
    slotPct=+percentOpt.percent||0;
    tier={type:"percent", value:slotPct, maxBonus:+percentOpt.maxBonus||0, turnover:+percentOpt.turnover||0, min:minDep, note:percentOpt.note||{bn:"",en:""}};
  } else {
    tier=(bonus.tiers||[]).filter(x=>n>=+x.min).sort((a,b)=>+b.min-+a.min)[0];
    minDep=tier?+tier.min||0:0;
  }
  if(n < minDep){
    out.innerHTML=`<p class="err">${lang==="bn"?`সর্বনিম্ন ডিপোজিট ${num(minDep)} ${APP_DATA.currency[lang]}`:`Minimum deposit ${num(minDep)} ${APP_DATA.currency[lang]}`}</p>`;
    return;
  }
  if(!tier){out.innerHTML=`<p class="muted">${t("none")}</p>`;return}
  const r=calculateBonus(n,tier),cur=APP_DATA.currency[lang];
  // Auto note
  let note="";
  if(lang==="bn"){
    if(isFixed){
      note=`স্যার, আপনি যদি এই বোনাসটি নির্বাচন করে ${num(n)} ${cur} ডিপোজিট করেন, তাহলে আপনি ${num(r.finalBonus)} ${cur} বোনাস পাবেন। অর্থাৎ, আপনার অ্যাকাউন্টে সর্বমোট ${num(r.accountTotal)} ${cur} জমা হবে।`;
      if(r.hasTurnover) note+=`\nএই বোনাসের শর্ত অনুযায়ী আপনার মোট টার্নওভার সম্পন্ন করতে হবে ${num(r.totalTurnover)} ${cur}। ধন্যবাদ। 😊`;
      else note+=`\nধন্যবাদ। 😊`;
    } else {
      note=`স্যার, আপনি যদি এই বোনাসের ${slotName||"বোনাস"} (${slotPct}%) সিলেক্ট করে ${num(n)} ${cur} ডিপোজিট করেন, তাহলে আপনি ${num(r.finalBonus)} ${cur} বোনাস পাবেন। অর্থাৎ, আপনার অ্যাকাউন্টে সর্বমোট ${num(r.accountTotal)} ${cur} জমা হবে`;
      if(r.hasTurnover) note+=` এবং বোনাসের শর্ত অনুযায়ী আপনাকে মোট ${num(r.totalTurnover)} ${cur} টার্নওভার সম্পন্ন করতে হবে। ধন্যবাদ। 😊`;
      else note+=`। ধন্যবাদ। 😊`;
    }
  } else {
    if(isFixed){
      note=`Sir, if you select this bonus and deposit ${num(n)} ${cur}, you will receive ${num(r.finalBonus)} ${cur} bonus. Your account total will be ${num(r.accountTotal)} ${cur}.`;
      if(r.hasTurnover) note+=`\nRequired total turnover: ${num(r.totalTurnover)} ${cur}. Thank you. 😊`;
      else note+=` Thank you. 😊`;
    } else {
      note=`Sir, if you select ${slotName||"this bonus"} (${slotPct}%) and deposit ${num(n)} ${cur}, you will receive ${num(r.finalBonus)} ${cur} bonus. Account total: ${num(r.accountTotal)} ${cur}`;
      if(r.hasTurnover) note+=`, and required turnover is ${num(r.totalTurnover)} ${cur}. Thank you. 😊`;
      else note+=`. Thank you. 😊`;
    }
  }
  let html=`<div class="result"><div>${t("bonusIs")}${r.capped?` <span class="cap-tag">${t("capped")}</span>`:""}${r.type==="fixed"?` <span class="cap-tag">Fixed</span>`:""}</div>
    <div class="amt">${num(r.finalBonus)} ${cur}</div>
    <div class="result-breakdown">
      <div><span>${lang==="bn"?"অ্যাকাউন্টে টোটাল":"Account total"}</span><span>${num(r.accountTotal)} ${cur}</span></div>
      <div><span>${t("eligibleDep")}</span><span>${num(r.eligibleDeposit)} ${cur}</span></div>`;
  if(r.excessDeposit>0) html+=`<div><span>${t("excessDep")}</span><span>${num(r.excessDeposit)} ${cur}</span></div>`;
  if(r.hasTurnover){
    html+=`<div><span>${t("bonusTO")}</span><span>${num(r.bonusTurnover)} ${cur}</span></div>`;
    if(r.excessDeposit>0) html+=`<div><span>${t("excessTO")}</span><span>${num(r.excessTurnover)} ${cur}</span></div>`;
    html+=`<div class="total"><span>${t("totalTO")}</span><span>${num(r.totalTurnover)} ${cur}</span></div>`;
  }
  html+=`</div>
    <div style="margin-top:10px"><label>${t("note")}</label>
      <textarea id="brandNote" readonly rows="5">${esc(note)}</textarea>
      <button class="btn sm ghost" data-act="copyBrandNote" style="margin-top:6px">${t("copyNote")}</button>
    </div>
  </div>`;
  out.innerHTML=html;
}

function spinPick(P){
  const w=P.map(p=>Math.max(0,+p.chance||0)),T=w.reduce((a,b)=>a+b,0),u=crypto.getRandomValues(new Uint32Array(1))[0]/4294967296;
  if(!T)return Math.floor(u*P.length);
  let r=u*T;for(let i=0;i<P.length;i++){r-=w[i];if(r<0)return i}return P.length-1;
}
function spinLeft(){
  const m=+APP_DATA.spin.maxPerDay||0;if(!m)return Infinity;

}

function spinGo(){
  const sp=APP_DATA.spin;if(window._spinning||sp.active===false)return;

  const P=sp.prizes,N=P.length,a=360/N,i=spinPick(P),c=(i+.5)*a+(Math.random()-.5)*a*.7,b=window._spinRot||0,R=b-(b%360)+2160+(360-c);

function launchConfetti(n){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const box=document.createElement("div");box.style.cssText="position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden";

    e.style.cssText=`position:absolute;top:-10px;left:${Math.random()*100}%;width:8px;height:12px;background:${cols[i%5]};border-radius:2px;opacity:.9`;
    e.animate([{transform:"translateY(0) rotate(0)"},{transform:`translateY(${innerHeight+30}px) rotate(${360+Math.random()*360}deg)`}],{duration:1400+Math.random()*900,easing:"cubic-bezier(.3,.6,.5,1)"});
    box.appendChild(e)}
  document.body.appendChild(box);setTimeout(()=>box.remove(),2500);
}

/* ---- shared data (Netlify function + Blobs) ---- */
var SV={on:false,tok:"",snap:null,ver:-1,t:0,poll:0,busy:false};
async function svCall(body){
  try{const r=await fetch("/.netlify/functions/api",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...body,token:SV.tok})});
    return {s:r.status,j:await r.json().catch(()=>({}))}}catch(e){return null}
}
async function svLogin(u,p){
  const r=await svCall({action:"login",username:u,password:p});
  if(!r||r.s===404)return null;                       // function not deployed -> local mode
  if(r.s>=500){toast(Lg("সার্ভার সমস্যা: ","Server problem: ")+String(r.j.error||r.s).slice(0,140));return {ok:false}}
  if(r.j.ok){SV.tok=r.j.token;SV.on=true;return r.j}
  return {ok:false,reason:r.j.reason||""};
}
function svOff(){SV.on=false;SV.tok="";SV.snap=null;SV.ver=-1;clearInterval(SV.poll);SV.poll=0}
const svIdArr=v=>Array.isArray(v)&&v.every(x=>x&&typeof x==="object"&&x.id!=null);
function svDiff(a,b){
  const P=[],J=JSON.stringify;
  const one=(path,x,y)=>{
    if(J(x)===J(y))return;
    if(svIdArr(y)&&svIdArr(x||[])){
      const m=new Map((x||[]).map(o=>[o.id,J(o)])),ids=new Set(y.map(o=>o.id));
      P.push({path,up:y.filter(o=>m.get(o.id)!==J(o)),rm:(x||[]).filter(o=>!ids.has(o.id)).map(o=>o.id)});
    }else P.push({path,set:y});
  };
  for(const k of Object.keys(b)){
    const x=a?a[k]:undefined,y=b[k];
    if(k==="__v")continue;
    if(y&&typeof y==="object"&&!Array.isArray(y)&&x&&typeof x==="object"&&!Array.isArray(x)){
      for(const q of Object.keys(y))one(k+"."+q,x[q],y[q]);
    }else one(k,x,y);
  }
  return P;
}
function svApply(state){
  APP_DATA=state;SV.snap=structuredClone(state);SV.ver=state.__v||0;wr(localStorage,STORE_KEY,JSON.stringify(APP_DATA));
  try{ensureDev&&ensureDev()}catch(e){}
}
async function svPull(force){
  if(!SV.on||SV.busy)return;
  const r=await svCall({action:"pull"});if(!r||r.s!==200)return;
  if(!r.j.state){ // nothing on the server yet: the first admin publishes the data
    const x=await svCall({action:"seed",data:APP_DATA});if(x&&x.j.state)svApply(x.j.state);return;
  }
  if(!force&&r.j.state.__v===SV.ver)return;
  if(!force&&svDiff(SV.snap,APP_DATA).length)return;  // local edits waiting to be sent
  svApply(r.j.state);
  const el=document.activeElement;
  if(!force&&!(el&&/INPUT|TEXTAREA|SELECT/.test(el.tagName)))render();
}
async function svPush(){
  if(!SV.on||SV.busy)return;
  const patch=svDiff(SV.snap,APP_DATA);if(!patch.length)return;
  SV.busy=true;const sent=JSON.stringify(APP_DATA);
  const r=await svCall({action:"push",patch});SV.busy=false;
  if(r&&r.s===200&&r.j.state){
    if(JSON.stringify(APP_DATA)===sent){svApply(r.j.state)}else{SV.snap=JSON.parse(sent)}
    if(patch.some(x=>x.path==="staff"))toast(Lg("☁️ স্টাফ সার্ভারে সেভ হয়েছে","☁️ Staff saved to server"));
  }else if(r&&r.s===401){toast(Lg("সেশন শেষ — আবার লগইন করুন","Session expired — log in again"))}
  else toast(Lg("⚠️ সার্ভারে সেভ হয়নি, আবার চেষ্টা করা হবে","⚠️ Not saved to server, will retry"))
}
function svSchedule(){if(!SV||!SV.on)return;clearTimeout(SV.t);SV.t=setTimeout(svPush,900)}
function svStart(){clearInterval(SV.poll);SV.poll=setInterval(()=>{svPush().then(()=>svPull())},12000)}
async function svPing(){
  if(!$("#svStat"))return;
  const r=await svCall({action:"ping"}),e=$("#svStat");if(!e)return;
  if(!r||r.s===404){e.textContent=Lg("⚠️ সার্ভার ফাংশন পাওয়া যায়নি — লোকাল মোড (অন্য PC-তে ইউজার লগইন হবে না)","⚠️ Server function not found — local mode (other PCs can't log in)");e.style.color="#b3261e"}
  else if(r.s===200&&r.j.ok&&r.j.blobs!==false){e.textContent=Lg("🟢 সার্ভার সংযুক্ত","🟢 Server connected");e.style.color="#16825d"}
  else{e.textContent=Lg("⚠️ সার্ভার সমস্যা: ","⚠️ Server problem: ")+String(r.j.error||r.s).slice(0,120);e.style.color="#b3261e"}
}

// Admin login: repair staff accounts that exist on the server without a saved password.
async function svFixStaffPw(lo){
  const r=await svCall({action:"info"});const miss=(r&&r.s===200&&r.j.noPw)||[];
  let fixed=0;
  (lo||[]).forEach(x=>{
    const y=(APP_DATA.staff||[]).find(z=>z.id===x.id)||(APP_DATA.staff||[]).find(z=>z.username===x.username);
    if(!y)APP_DATA.staff.push(x),fixed++;
    else if(miss.includes(y.id)){y.password=x.password;fixed++}
  });
  if(fixed)saveData(true);
  const left=(APP_DATA.staff||[]).filter(z=>miss.includes(z.id)&&!(lo||[]).some(x=>x.id===z.id||x.username===z.username));
  if(left.length)setTimeout(()=>toast(Lg("⚠️ এই স্টাফদের পাসওয়ার্ড সার্ভারে নেই, তাই লগইন হবে না — স্টাফ লিস্ট থেকে নতুন পাসওয়ার্ড দিন: ","⚠️ These staff have no password on the server and can't log in — set a new password from the staff list: ")+left.map(z=>z.username).join(", "),9000),900);
}
function doLogin(){
  const now = Date.now();
  if(now < loginLockUntil){
    const sec = Math.ceil((loginLockUntil - now)/1000);
    $("#err").textContent = (lang==="bn"?"অনেক ভুল চেষ্টা। ":"Too many attempts. ")+sec+"s";
    $("#loginCard")?.classList.add("login-shake");
    setTimeout(()=>$("#loginCard")?.classList.remove("login-shake"),400);
    return;
  }
  const uname=($("#uname")?.value||"").trim(), pw=$("#pw")?.value||"", u=APP_DATA.users;
  if(!uname || !pw){
    $("#err").textContent = lang==="bn"?"ইউজারনেম ও পাসওয়ার্ড দিন":"Enter username and password";
    return;
  }
  $("#loginBtn")?.classList.add("loading");
  // small delay for UX
  setTimeout(async()=>{
    $("#loginBtn")?.classList.remove("loading");
    if($("#remUser"))wr(localStorage,"bp_remember_user",$("#remUser").checked?uname:"");
    const sv=await svLogin(uname,pw);
    if(sv&&sv.ok){const lo=sv.role==="admin"?(APP_DATA.staff||[]).filter(x=>x.password):[];await svPull(true);svStart();
      if(sv.role==="admin")await svFixStaffPw(lo);}
    const stf=sv?(sv.ok&&sv.role==="staff"?(APP_DATA.staff||[]).find(x=>x.id===sv.staffId):null):(APP_DATA.staff||[]).find(x=>x.username===uname&&x.password===pw);
    if(sv?(sv.ok&&sv.role==="admin"):(uname===u.admin.username && pw===u.admin.password)){
      loginFails=0;
      role="admin";currentUser=uname;view="admin";
      setTimeout(()=>launchConfetti(16),200);adminTab="dashboard";
      addLoginLog(uname,"admin",true);addActivity("login","Admin login");render();
    } else if(stf){
      loginFails=0;staffLogin(stf);
    } else if(sv?(sv.ok&&sv.role==="user"):(!(APP_DATA.staff||[]).length && uname===u.user.username && pw===u.user.password)){
      loginFails=0;
      role="user";currentUser=uname;view="home";
      addLoginLog(uname,"user",true);
      setTimeout(()=>launchConfetti(24),200);addActivity("login","User login");render();
    } else {
      loginFails++;
      addLoginLog(uname||"(empty)","unknown",false);{const ss=(APP_DATA.staff||[]).find(x=>x.username===uname);if(ss)addAlert("suspicious",ss.id,ss.name+": wrong password attempt")}
      $("#err").textContent = (sv&&sv.reason==="nopw"?Lg("এই স্টাফ অ্যাকাউন্টের পাসওয়ার্ড সার্ভারে সেভ নেই। অ্যাডমিনকে স্টাফ লিস্ট থেকে নতুন পাসওয়ার্ড সেট করতে বলুন।","This staff account has no password saved on the server. Ask the admin to set a new password from the staff list."):sv&&sv.reason==="staffonly"?Lg("স্টাফ অ্যাকাউন্ট চালু থাকায় সাধারণ ইউজার লগইন বন্ধ। নিজের স্টাফ ইউজারনেম দিয়ে লগইন করুন।","The shared user login is off because staff accounts exist. Log in with your own staff username."):t("wrong")) + (loginFails>=3 ? (lang==="bn"?" ("+loginFails+"/5)":" ("+loginFails+"/5)") : "");
      $("#loginCard")?.classList.add("login-shake");
      setTimeout(()=>$("#loginCard")?.classList.remove("login-shake"),400);
      if(loginFails >= 5){
        {const n=(+rd(localStorage,"bp_lockn")||0)+1;wr(localStorage,"bp_lockn",String(n));loginLockUntil=Date.now()+Math.min(30*2**(n-1),600)*1000;wr(localStorage,"bp_lock",String(loginLockUntil))}
        loginFails = 0;
        $("#err").textContent = (lang==="bn"?"৫ বার ভুল। "+Math.round((loginLockUntil-Date.now())/1000)+" সেকেন্ড লক।":"5 failed attempts. Locked "+Math.round((loginLockUntil-Date.now())/1000)+"s.");
      }
      $("#pw").value = "";
      $("#pw").focus();
    }
  }, 280);
}

  else if(act==="sm_view"){const x=APP_DATA.shots.find(z=>z.id===id);if(x)modal(`<img src="${x.img}" style="width:100%"><div class="muted">${esc(x.user)} · ${fmtTime(x.t)}</div>`)}
  else if(act==="sm_saveBrand"){const g=x=>($(x)?.value||"").trim();APP_DATA.brand=Object.assign({},APP_DATA.brand,{name:g("#brName"),tag:g("#brTag"),notice:g("#brNotice"),noticeOn:!!$("#brOn")?.checked});addActivity("brand_update");R();toast("✔")}
  else if(act==="sm_idle"){const o=[0,10,30,60];APP_DATA.brand.idle=o[(o.indexOf(APP_DATA.brand.idle||0)+1)%4];R()}

/* ===== Password reset ===== */
const rsCnt=()=>{ensureDev();return APP_DATA.resets.filter(r=>r.status==="pending").length};
const genTmp=()=>{const c="abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";return[...crypto.getRandomValues(new Uint32Array(8))].map(n=>c[n%c.length]).join("")};
function RSH(){ensureDev();const P=APP_DATA.resets.filter(r=>r.status==="pending"),H=APP_DATA.resets.filter(r=>r.status!=="pending").slice(0,5);
  const row=r=>{const x=sName(r.staffId)||{name:"?",empId:"?"};return `<div class="log-item"><div>${esc(x.name)} (${esc(x.empId)})<div class="log-time">${fmtTime(r.t)}</div></div><div>${r.status==="pending"?`<button class="btn sm ok" data-act="rs_gen" data-id="${r.id}">${Lg("অস্থায়ী পাসওয়ার্ড","Temp password")}</button> <button class="btn sm ghost" data-act="rs_rej" data-id="${r.id}">${Lg("বাতিল","Reject")}</button>`:`<span class="badge ${r.status==="done"?"ok":"off"}">${r.status}</span>`}</div></div>`};
  return `<div class="section-title" style="margin-top:18px"><h3 style="margin:0">🔑 ${Lg("পাসওয়ার্ড রিসেট রিকোয়েস্ট","Password Reset Requests")} (${P.length})</h3></div><div class="card">${[...P,...H].map(row).join("")||`<p class="muted">${t("noLogs")}</p>`}</div>`}
function rsAct(act,id){
  syncDev();const R=()=>{saveData(true);render()};
  if(act==="rs_open")modal(`<h3>🔑 ${Lg("পাসওয়ার্ড রিসেট রিকোয়েস্ট","Password reset request")}</h3><p class="sub">${Lg("ইউজারনেম ও Employee ID দিন। অ্যাডমিন আপনাকে অস্থায়ী পাসওয়ার্ড জানাবেন।","Enter your username and Employee ID. Admin will give you a temporary password.")}</p><div class="fld"><label>${t("username")}</label><input id="rsU"></div><div class="fld"><label>Employee ID</label><input id="rsE"></div><p id="rsM" class="muted"></p><button class="btn" data-act="rs_submit">${Lg("রিকোয়েস্ট পাঠান","Send request")}</button> <button class="btn ghost" data-act="rs_close">${t("back")}</button>`);
  else if(act==="rs_close")closeMod();
  else if(act==="rs_submit"){const u=($("#rsU")?.value||"").trim(),e=($("#rsE")?.value||"").trim(),m=$("#rsM");if(!u||!e){m.textContent=Lg("দুটো ঘরই পূরণ করুন","Fill both fields");return}
    const x=APP_DATA.staff.find(z=>z.username===u&&z.empId===e);
    if(x&&!APP_DATA.resets.some(r=>r.staffId===x.id&&r.status==="pending")){APP_DATA.resets.unshift({id:uid(),staffId:x.id,t:Date.now(),status:"pending"});addAlert("reset",x.id,x.name+" ("+x.empId+"): password reset requested");saveData(true)}
    m.textContent=Lg("রিকোয়েস্ট নেওয়া হয়েছে। তথ্য মিললে অ্যাডমিন রিসেট করে আপনাকে জানাবেন।","Request received. If the details match, admin will reset it and tell you.")}
  else if(act==="rs_gen"){const r=APP_DATA.resets.find(z=>z.id===id),x=r&&sName(r.staffId);if(!x)return;const tmp=genTmp();x.password=tmp;x.mustChange=true;r.status="done";addActivity("password_reset",x.name);saveData(true);render();
    modal(`<h3>🔑 ${esc(x.name)}</h3><p>${Lg("অস্থায়ী পাসওয়ার্ড (শুধু এখনই দেখা যাবে, স্টাফকে জানিয়ে দিন):","Temporary password (shown only now, tell the staff member):")}</p><p><code style="font-size:24px;letter-spacing:2px;user-select:all">${tmp}</code></p><p class="muted">${Lg("প্রথম লগইনে স্টাফকে নিজের নতুন পাসওয়ার্ড দিতে হবে।","The staff member must set their own password at first login.")}</p><button class="btn" data-act="rs_close">OK</button>`)}
  else if(act==="rs_rej"){const r=APP_DATA.resets.find(z=>z.id===id);if(r){r.status="rejected";R()}}}

setInterval(()=>{const m=APP_DATA.brand?.idle;if(role&&m&&Date.now()-lastAct>m*60000){endSession();addActivity("auto_logout");role=null;currentUser=null;view="login";render();toast(Lg("নিষ্ক্রিয় থাকায় লগআউট হয়েছে","Logged out due to inactivity"))}},15000);
function csvAtt(){const rows=[["Name","Employee ID","Date","In","Out","Minutes"]],tm=v=>v?new Date(v).toLocaleTimeString("en-GB"):"";
  APP_DATA.attendance.filter(a=>a.date.startsWith(attMon)).forEach(a=>{const x=sName(a.staffId)||{name:"?",empId:"?"};rows.push([x.name,x.empId,a.date,tm(a.in),tm(a.out||a.last),Math.round(((a.out||a.last)-a.in)/60000)])});
  const q=v=>{v=String(v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'},a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["\ufeff"+rows.map(r=>r.map(q).join(",")).join("\r\n")],{type:"text/csv"}));a.download="attendance-"+attMon+".csv";a.click()}
